<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>2026 뮤지컬 공연 라인업</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0d0d1a;--bg2:#13132a;--bg3:#1a1a35;
  --border:#252548;--text1:#e8e8f2;--text2:#7878a8;--text3:#3a3a68;
  --accent:#8b7cf8;--today:#ff5f5f;
  --header-h:52px;--month-h:36px;--venue-w:210px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text1);display:flex;flex-direction:column;height:100dvh;}

/* Header */
#header{height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;z-index:20;}
#hdr-left{display:flex;align-items:center;gap:8px;flex-shrink:0;}
#header h1{font-size:15px;font-weight:700;white-space:nowrap;}
#hdr-right{display:flex;align-items:center;gap:6px;margin-left:auto;}

/* Tabs */
#tab-bar{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px;flex-shrink:0;}
.tab-btn{background:none;border:none;color:var(--text2);padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--bg3);color:var(--text1);}

/* Ctrl groups */
.ctrl-grp{display:flex;align-items:center;gap:6px;}
.ctrl-grp.hidden{display:none;}

/* Inputs */
#header select,#header input[type=search],#header input[type=text]{
  background:var(--bg3);border:1px solid var(--border);color:var(--text1);
  padding:6px 8px;border-radius:8px;font-size:13px;
  -webkit-appearance:none;appearance:none;outline:none;
  text-align:center;text-align-last:center;
}
#header input::placeholder{text-align:center;color:var(--text3);}
#rg{width:82px;}#sg{width:144px;}
#rl{width:80px;}#sl{width:78px;}#vl{width:80px;}#ol{width:106px;}#ql{width:136px;}
#qr{width:136px;}

/* Zoom */
#zoom-wrap{position:relative;flex-shrink:0;}
#zoom-ctrl{display:flex;align-items:center;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px 4px;}
#zoom-ctrl button{background:none;border:none;color:var(--text1);width:22px;height:22px;border-radius:4px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#zoom-ctrl button:active{background:var(--border);}
#zoom-ctrl button:disabled{color:var(--text3);cursor:default;}
#zoom-label{font-size:11px;color:var(--text2);min-width:34px;text-align:center;cursor:pointer;padding:2px 4px;border-radius:4px;}
#zoom-label:hover{background:var(--border);color:var(--text1);}
#zoom-menu{display:none;position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:60;min-width:90px;box-shadow:0 8px 24px rgba(0,0,0,.5);}
#zoom-menu.open{display:block;}
.zoom-opt{display:block;width:100%;padding:9px 20px;background:none;border:none;color:var(--text1);font-size:13px;cursor:pointer;text-align:center;}
.zoom-opt:hover{background:var(--border);}
.zoom-opt.cur{color:var(--accent);font-weight:700;}

/* Buttons */
#today-btn{background:var(--bg3);border:1px solid var(--border);color:var(--today);padding:6px 11px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
#today-btn:active{opacity:.7;}
#ending-btn{background:var(--bg3);border:1px solid var(--border);color:#ffa030;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.act-btn{background:var(--bg3);border:1px solid var(--border);color:var(--accent);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.act-btn:hover{background:rgba(139,124,248,.08);}
#count-badge{font-size:11px;color:var(--text2);white-space:nowrap;min-width:70px;text-align:right;}

/* Tab contents */
.tab-content{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.tab-content.hidden{display:none!important;}

/* Gantt */
#chart-outer{flex:1;display:flex;overflow:hidden;}
#venue-col{width:var(--venue-w);flex-shrink:0;display:flex;flex-direction:column;background:var(--bg2);border-right:2px solid var(--border);z-index:10;}
#venue-col-header{height:var(--month-h);display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);flex-shrink:0;text-transform:uppercase;letter-spacing:.5px;}
#venue-list{flex:1;overflow-y:hidden;}
.venue-row{display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border);}
.venue-name{font-size:12px;font-weight:600;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
#timeline-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#month-header-wrap{height:var(--month-h);overflow-x:hidden;flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);}
#month-header{height:var(--month-h);position:relative;}
.month-cell{position:absolute;top:0;height:100%;display:flex;align-items:flex-start;padding:5px 0 0 7px;font-size:11px;font-weight:700;color:var(--text2);border-left:1px solid var(--border);overflow:hidden;}
.week-tick{position:absolute;bottom:0;width:1px;height:10px;background:var(--border);}
.day-tick{position:absolute;bottom:0;height:16px;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text3);border-left:1px solid var(--border);overflow:hidden;}
.day-tick.ws{height:20px;color:var(--text2);border-left-color:rgba(120,120,180,.4);}
#gantt-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;}
#gantt-body{position:relative;min-height:100%;}
.gantt-row{position:relative;border-bottom:1px solid var(--border);}
.gantt-row:nth-child(odd){background:rgba(255,255,255,.012);}
.month-line{position:absolute;top:0;bottom:0;width:1px;background:var(--border);opacity:.6;pointer-events:none;}
.show-bar{position:absolute;border-radius:4px;display:flex;align-items:center;padding:0 5px;cursor:pointer;overflow:hidden;font-size:10px;font-weight:700;white-space:nowrap;user-select:none;transition:filter .12s,transform .12s;letter-spacing:-.2px;}
.show-bar:hover{filter:brightness(1.2);transform:scaleY(1.08);z-index:5;}
.show-bar.es{box-shadow:0 0 0 1.5px rgba(255,160,50,.85);}
#today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:6;pointer-events:none;box-shadow:0 0 6px rgba(255,95,95,.5);}
#today-pill{position:absolute;top:4px;background:var(--today);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:10px;white-space:nowrap;pointer-events:none;z-index:7;transform:translateX(-50%);}

/* List */
#list-view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.list-tbl{width:100%;border-collapse:collapse;}
.list-tbl th{position:sticky;top:0;z-index:5;background:var(--bg2);padding:10px 14px;font-size:11px;font-weight:600;color:var(--text2);text-align:left;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.list-tbl td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.list-row:hover{background:rgba(255,255,255,.03);}
.cell-name{display:flex;align-items:center;gap:8px;}
.ndot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ntext{font-size:13px;font-weight:600;color:var(--text1);}
.ebadge{display:inline-block;padding:2px 7px;border-radius:10px;flex-shrink:0;font-size:10px;font-weight:700;background:rgba(255,160,50,.18);color:#ffa030;}
.col-venue{font-size:12px;color:var(--text2);}
.col-dates{font-size:12px;color:var(--text2);white-space:nowrap;}
.col-dur{font-size:11px;color:var(--text3);margin-top:2px;}
.vcell{display:flex;align-items:center;gap:4px;}
.vbtn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);padding:2px 4px;border-radius:6px;line-height:1;}
.vbtn.on{color:var(--accent);}
.vbtn:hover{background:var(--border);}
.rpill{font-size:9px;background:rgba(139,124,248,.2);color:var(--accent);padding:1px 5px;border-radius:8px;font-weight:700;}
.sbadge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.ongoing{background:rgba(76,186,128,.18);color:#4cde90;}
.ended{background:rgba(100,100,130,.18);color:#8888aa;}
.upcoming{background:rgba(139,124,248,.18);color:#a898ff;}

/* Record tab */
#rec-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.rec-tbl{width:100%;border-collapse:collapse;}
.rec-tbl th{position:sticky;top:0;z-index:5;background:var(--bg2);padding:10px 14px;font-size:11px;font-weight:600;color:var(--text2);text-align:left;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.rec-tbl td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
.rec-row:hover{background:rgba(255,255,255,.03);}
.rdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rcnt{font-size:11px;padding:2px 8px;background:rgba(139,124,248,.15);color:var(--accent);border-radius:10px;white-space:nowrap;display:inline-block;}
.radd{background:none;border:1px solid rgba(139,124,248,.4);color:var(--accent);padding:3px 9px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.radd:hover{background:rgba(139,124,248,.1);}
.rexp{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 8px;border-radius:7px;font-size:11px;cursor:pointer;white-space:nowrap;}
.rexp:hover{background:var(--border);}
.dchip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;background:var(--bg3);border:1px solid rgba(139,124,248,.4);border-radius:12px;font-size:11px;color:var(--accent);cursor:pointer;white-space:nowrap;}
.dchip:hover{background:rgba(139,124,248,.08);}
.rec-detail-row{display:none;}
.rec-detail-row.open{display:table-row;}
.rec-detail-td{background:var(--bg);padding:0!important;}
.rec-entries-inner{padding:8px 14px 10px;display:flex;flex-direction:column;gap:0;}
.rentry{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.rentry:last-child{border-bottom:none;}
.edate{font-size:13px;color:var(--text1);flex:1;}
.ephoto{background:none;border:none;font-size:14px;cursor:pointer;color:var(--accent);padding:2px 6px;border-radius:6px;}
.ephoto:hover{background:rgba(139,124,248,.1);}
.edel{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;padding:2px 6px;border-radius:6px;}
.edel:hover{color:#ff5f5f;background:rgba(255,95,95,.1);}
.empty-st{display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text2);gap:10px;font-size:14px;text-align:center;}
.empty-st.show{display:flex;}
.empty-st span:first-child{font-size:38px;}

/* Detail modal */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;}
#overlay.open{display:flex;}
#modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:24px;width:min(500px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto;}
.mcolorbar{height:4px;border-radius:2px;margin-bottom:16px;}
#modal h2{font-size:17px;font-weight:700;line-height:1.3;margin-bottom:14px;}
.minfo{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.mrow{display:flex;gap:10px;align-items:flex-start;}
.mlbl{font-size:11px;color:var(--text2);min-width:60px;text-transform:uppercase;letter-spacing:.3px;padding-top:2px;}
.mval{font-size:14px;color:var(--text1);flex:1;line-height:1.5;}
.mdiv{height:1px;background:var(--border);margin:10px 0;}
#mstar{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 12px;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:6px;}
#mstar.on{color:var(--accent);border-color:rgba(139,124,248,.5);background:rgba(139,124,248,.08);}
#mrecdates{display:flex;flex-wrap:wrap;gap:4px;}
.mdrec{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);padding:3px 9px;border-radius:12px;}
.mdrec.hp{color:var(--accent);border-color:rgba(139,124,248,.4);cursor:pointer;}
.mbtns{display:flex;gap:8px;margin-top:16px;}
#mcls{flex:1;padding:11px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:14px;cursor:pointer;}
#madd{flex:2;padding:11px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}

/* Add record modal */
#aro{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:110;align-items:center;justify-content:center;}
#aro.open{display:flex;}
#arm{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:24px;width:min(400px,92vw);}
#arm h3{font-size:15px;font-weight:700;margin-bottom:4px;}
#armshow{font-size:12px;color:var(--text2);margin-bottom:18px;}
.afl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.aff{margin-bottom:14px;}
.aff-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
#ardate{background:var(--bg3);border:1px solid var(--border);color:var(--text1);padding:7px 12px;border-radius:8px;font-size:14px;outline:none;}
.pzone{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:var(--text2);font-size:13px;transition:border-color .15s,color .15s;}
.pzone:hover{border-color:var(--accent);color:var(--accent);}
.pzone.filled{border-color:var(--accent);color:var(--accent);}
#arfile{display:none;}
#arpreview{width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-top:8px;display:none;}
.arbtns{display:flex;gap:8px;margin-top:18px;}
#arcancel{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:11px;border-radius:10px;font-size:14px;cursor:pointer;}
#arsave{flex:2;background:var(--accent);border:none;color:#fff;padding:11px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}

/* Ending modal */
#eo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:105;align-items:flex-end;justify-content:center;}
#eo.open{display:flex;}
#em{background:var(--bg2);border:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px 20px 0;width:100%;max-width:640px;max-height:72vh;display:flex;flex-direction:column;}
#em h3{font-size:15px;font-weight:700;margin-bottom:3px;flex-shrink:0;}
#esub{font-size:11px;color:var(--text2);margin-bottom:12px;flex-shrink:0;}
#elist{flex:1;overflow-y:auto;}
.eitem{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.eitem:last-child{border-bottom:none;}
.eitem:hover{background:rgba(255,255,255,.03);}
.edays{min-width:46px;padding:3px 0;border-radius:8px;font-size:12px;font-weight:700;text-align:center;}
.dr{background:rgba(255,80,80,.2);color:#ff5050;}
.do{background:rgba(255,160,50,.2);color:#ffa030;}
.dg{background:rgba(80,200,120,.15);color:#50c878;}
.ename{flex:1;font-size:13px;font-weight:600;color:var(--text1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.evenue{font-size:11px;color:var(--text2);}
.edate2{font-size:11px;color:var(--text3);white-space:nowrap;}
#ecls{width:100%;background:none;border:none;color:var(--text2);padding:14px;font-size:13px;cursor:pointer;flex-shrink:0;}

/* Photo overlay */
#po{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:150;align-items:center;justify-content:center;}
#po.open{display:flex;}
#pimg{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain;}
#pcls{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<div id="header">
  <div id="hdr-left">
    <h1>🎭 2026 뮤지컬</h1>
    <div id="tab-bar">
      <button class="tab-btn active" data-tab="gantt">간트</button>
      <button class="tab-btn" data-tab="list">리스트</button>
      <button class="tab-btn" data-tab="record">기록</button>
    </div>
  </div>
  <div id="hdr-right">
    <div id="gc" class="ctrl-grp">
      <select id="rg"><option value="">전체 지역</option></select>
      <input type="search" id="sg" placeholder="공연명 · 극장" autocomplete="off" spellcheck="false">
      <div id="zoom-wrap">
        <div id="zoom-ctrl">
          <button id="zoom-out" disabled>−</button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in">+</button>
        </div>
        <div id="zoom-menu"></div>
      </div>
      <button id="today-btn">오늘</button>
    </div>
    <div id="lc" class="ctrl-grp hidden">
      <select id="rl"><option value="">전체 지역</option></select>
      <select id="sl"><option value="">전체 상태</option><option value="ongoing">공연중</option><option value="upcoming">예정</option><option value="ended">종료</option></select>
      <select id="vl"><option value="">관람 전체</option><option value="viewed">관람</option><option value="unviewed">미관람</option></select>
      <select id="ol"><option value="status">상태순</option><option value="name">가나다순</option><option value="dur-asc">기간 짧은순</option><option value="dur-desc">기간 긴순</option></select>
      <input type="search" id="ql" placeholder="공연명 · 극장" autocomplete="off" spellcheck="false">
    </div>
    <div id="rc" class="ctrl-grp hidden">
      <input type="search" id="qr" placeholder="공연명 검색" autocomplete="off" spellcheck="false">
      <button id="csv-btn" class="act-btn">CSV 다운로드</button>
      <button id="zip-btn" class="act-btn">ZIP 다운로드</button>
    </div>
    <button id="ending-btn">⏰ <span id="ecnt">0</span></button>
    <span id="count-badge"></span>
  </div>
</div>

<!-- 간트 -->
<div id="tab-gantt" class="tab-content">
  <div id="chart-outer">
    <div id="venue-col">
      <div id="venue-col-header">공연장</div>
      <div id="venue-list"></div>
    </div>
    <div id="timeline-area">
      <div id="month-header-wrap"><div id="month-header"></div></div>
      <div id="gantt-scroll">
        <div id="gantt-body">
          <div id="today-line"></div>
          <div id="today-pill">오늘</div>
          <div id="gempty" class="empty-st"><span>🔍</span><span>해당하는 공연이 없습니다</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 리스트 -->
<div id="tab-list" class="tab-content hidden">
  <div id="list-view">
    <table class="list-tbl">
      <thead><tr>
        <th style="width:52px"></th>
        <th>공연명</th>
        <th style="width:84px">상태</th>
        <th>극장</th>
        <th style="width:56px">지역</th>
        <th>기간</th>
      </tr></thead>
      <tbody id="ltbody"></tbody>
    </table>
    <div id="lempty" class="empty-st"><span>🔍</span><span>해당하는 공연이 없습니다</span></div>
  </div>
</div>

<!-- 기록 -->
<div id="tab-record" class="tab-content hidden">
  <div id="rec-wrap">
    <table class="rec-tbl">
      <thead><tr>
        <th>공연명</th>
        <th style="width:84px">상태</th>
        <th>극장</th>
        <th style="width:64px">관람</th>
        <th>사진 증빙 날짜</th>
        <th style="width:110px"></th>
      </tr></thead>
      <tbody id="rec-tbody"></tbody>
    </table>

<script src="data/shows.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
<script>
const MONTH_DAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
const MONTH_NAMES=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const TOTAL_DAYS=MONTH_DAYS.reduce((a,b)=>a+b,0);
const ZOOM_LEVELS=[3.2,4.8,6.4,9.6,14.4];
const SL={ongoing:'공연중',ended:'종료',upcoming:'예정'};
const PAL=['#7c6cf4','#f4706c','#4cba80','#f4c83c','#4caaf4','#f46cd4','#78e070','#f49a60','#4cb0f4','#d468f4','#f0e060','#50d4c0','#f46890','#90d450','#6888f4','#f4b060','#50d490','#e060f4','#c8f460','#60ccf4'];

let zIdx=0,dpx=ZOOM_LEVELS[0],curTab='gantt',curShow=null,arTarget=null,pendPhoto=null;

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h;}
const CC={};
function sc(n){return CC[n]||(CC[n]=PAL[hash(n)%PAL.length]);}
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

const today=new Date();
const TI=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');

function gst(s){if(s.end<TI)return'ended';if(s.start<=TI)return'ongoing';return'upcoming';}
function dl(s){const e=pi(s.end);return e?Math.ceil((e-today)/86400000):9999;}
function es(s){return gst(s)==='ongoing'&&dl(s)<=14;}
function bc(s){const t=gst(s);if(t==='ended')return'#424258';const v=sc(s.name);if(t==='ongoing')return v;const[r,g,b]=h2r(v);return`rgb(${Math.round(r+(255-r)*.52)},${Math.round(g+(255-g)*.52)},${Math.round(b+(255-b)*.52)})`;}
function btc(s){const t=gst(s);if(t==='ended')return'rgba(255,255,255,.45)';if(t==='upcoming')return'rgba(20,20,40,.75)';return'rgba(255,255,255,.92)';}
function cn(n){return n.replace(/\s*\(구[^)]+\)/g,'').replace(/\s+/g,' ').trim();}
function vd(f,h){const cf=cn(f),ch=cn(h);return cf===ch?ch:cf+' '+ch;}
function sk(s){return s.name+'\x00'+s.facility+'\x00'+s.hall;}
function pi(s){if(!s||s.length<10)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dof(d){let x=0;for(let i=0;i<d.getMonth();i++)x+=MONTH_DAYS[i];return x+d.getDate()-1;}
function fd(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return y+'.'+m+'.'+d;}
function fds(iso){if(!iso)return'';const[,m,d]=iso.split('-');return m+'.'+d;}
function dur(s){const a=pi(s.start),b=pi(s.end);return a&&b?Math.round((b-a)/86400000)+1:0;}

const SHOWS=SHOWS_RAW.map(r=>({name:r[0],start:r[1],end:r[2],facility:r[3],hall:r[4],region:r[5]}));
const SM={};SHOWS.forEach(s=>{SM[sk(s)]=s;});

// Storage
const VK='lineup2026_viewed',RK='lineup2026_records';
function gv(){try{return JSON.parse(localStorage.getItem(VK)||'{}')}catch{return{}}}
function sv(v){localStorage.setItem(VK,JSON.stringify(v));}
function iv(s){return!!gv()[sk(s)];}
function setv(s,val){const v=gv(),k=sk(s);if(val)v[k]=true;else delete v[k];sv(v);}
function tv(s){setv(s,!iv(s));}
function gr(){try{return JSON.parse(localStorage.getItem(RK)||'{}')}catch{return{}}}
function sr(r){localStorage.setItem(RK,JSON.stringify(r));}
function gsr(s){return gr()[sk(s)]||[];}
function addRec(s,date,photo){const r=gr(),k=sk(s);if(!r[k])r[k]=[];r[k].push({id:(Date.now()).toString(36)+Math.random().toString(36).slice(2),date,photo:photo||null});sr(r);setv(s,true);}
function delRec(s,id){const r=gr(),k=sk(s);if(!r[k])return;r[k]=r[k].filter(e=>e.id!==id);if(!r[k].length)delete r[k];sr(r);}

// Populate regions
const REGS=[...new Set(SHOWS.map(s=>s.region).filter(Boolean))].sort();
['rg','rl'].forEach(id=>{const sel=document.getElementById(id);REGS.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o);});sel.value='서울';});

// Zoom
const gscroll=document.getElementById('gantt-scroll');
const gbody=document.getElementById('gantt-body');
const vlist=document.getElementById('venue-list');
const mhwrap=document.getElementById('month-header-wrap');
const mhdr=document.getElementById('month-header');
const cbadge=document.getElementById('count-badge');
const ov=document.getElementById('overlay');

function buildZoomMenu(){
  const m=document.getElementById('zoom-menu');m.innerHTML='';
  ZOOM_LEVELS.map(z=>Math.round(z/ZOOM_LEVELS[0]*100)).forEach((p,i)=>{
    const b=document.createElement('button');b.className='zoom-opt'+(i===zIdx?' cur':'');b.textContent=p+'%';
    b.addEventListener('click',e=>{e.stopPropagation();if(i===zIdx){m.classList.remove('open');return;}doZoom(i);m.classList.remove('open');});
    m.appendChild(b);
  });
}
function updateZoom(){document.getElementById('zoom-label').textContent=Math.round(dpx/ZOOM_LEVELS[0]*100)+'%';document.getElementById('zoom-out').disabled=zIdx===0;document.getElementById('zoom-in').disabled=zIdx===ZOOM_LEVELS.length-1;buildZoomMenu();}
function doZoom(ni){if(ni<0||ni>=ZOOM_LEVELS.length)return;const cf=(gscroll.scrollLeft+gscroll.clientWidth/2)/(TOTAL_DAYS*dpx);zIdx=ni;dpx=ZOOM_LEVELS[ni];buildHdr();render();gscroll.scrollLeft=cf*(TOTAL_DAYS*dpx)-gscroll.clientWidth/2;updateZoom();}

function buildHdr(){
  const tot=TOTAL_DAYS*dpx;mhdr.innerHTML='';mhdr.style.width=tot+'px';let off=0;
  MONTH_DAYS.forEach((days,mi)=>{
    const c=document.createElement('div');c.className='month-cell';c.textContent=MONTH_NAMES[mi];
    c.style.left=(off*dpx)+'px';c.style.width=(days*dpx)+'px';mhdr.appendChild(c);
    if(dpx>=9.6){for(let d=1;d<days;d++){const t=document.createElement('div');t.className='day-tick'+(d%7===0?' ws':'');t.textContent=d+1;t.style.left=((off+d)*dpx)+'px';t.style.width=dpx+'px';mhdr.appendChild(t);}}
    else{for(let w=7;w<days;w+=7){const t=document.createElement('div');t.className='week-tick';t.style.left=((off+w)*dpx)+'px';mhdr.appendChild(t);}}
    off+=days;
  });
  const tl=document.getElementById('today-line'),tp=document.getElementById('today-pill');
  if(today.getFullYear()===2026){const tx=dof(today)*dpx;tl.style.left=tx+'px';tl.style.display='';tp.style.left=tx+'px';tp.style.display='';}
  else{tl.style.display='none';tp.style.display='none';}
}

function assignLanes(shows){
  const srt=[...shows].sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
  const le=[];srt.forEach(s=>{let p=false;for(let i=0;i<le.length;i++){if(le[i]<s.start){s._l=i;le[i]=s.end;p=true;break;}}if(!p){s._l=le.length;le.push(s.end);}});
  const mx=le.length-1;shows.forEach(s=>{s._l=mx-s._l;});return le.length;
}

let syncLock=false;
gscroll.addEventListener('scroll',()=>{if(syncLock)return;syncLock=true;mhwrap.scrollLeft=gscroll.scrollLeft;vlist.scrollTop=gscroll.scrollTop;syncLock=false;});
vlist.addEventListener('scroll',()=>{if(syncLock)return;syncLock=true;gscroll.scrollTop=vlist.scrollTop;syncLock=false;});

function render(){
  const tot=TOTAL_DAYS*dpx;
  const reg=document.getElementById('rg').value,q=document.getElementById('sg').value.trim().toLowerCase();
  const fl=SHOWS.filter(s=>{if(reg&&s.region!==reg)return false;if(q&&!(s.name+s.facility+s.hall).toLowerCase().includes(q))return false;return true;});
  const vm=new Map();fl.forEach(s=>{const k=s.facility+'\x00'+s.hall;if(!vm.has(k))vm.set(k,{d:vd(s.facility,s.hall),shows:[]});vm.get(k).shows.push(s);});
  const venues=[...vm.values()].sort((a,b)=>a.d<b.d?-1:1);
  vlist.innerHTML='';gbody.querySelectorAll('.gantt-row,.month-line').forEach(el=>el.remove());
  document.getElementById('gempty').classList.toggle('show',venues.length===0);
  if(curTab==='gantt')cbadge.textContent=fl.length+'개 / '+venues.length+'개 극장';
  gbody.style.width=tot+'px';
  let lo=0;MONTH_DAYS.forEach(d=>{const l=document.createElement('div');l.className='month-line';l.style.left=(lo*dpx)+'px';gbody.insertBefore(l,document.getElementById('today-line'));lo+=d;});
  venues.forEach(({d:dsp,shows})=>{
    const lc=assignLanes(shows),rh=lc*28+10;
    const vr=document.createElement('div');vr.className='venue-row';vr.style.height=rh+'px';
    const nm=document.createElement('div');nm.className='venue-name';nm.textContent=dsp;nm.title=dsp;vr.appendChild(nm);vlist.appendChild(vr);
    const gr=document.createElement('div');gr.className='gantt-row';gr.style.height=rh+'px';gr.style.width=tot+'px';
    shows.forEach(s=>{
      const sd=pi(s.start),ed=pi(s.end);if(!sd||!ed)return;
      const sx=dof(sd)*dpx,ex=(dof(ed)+1)*dpx,w=Math.max(4,ex-sx),y=5+s._l*28,h=25;
      const bar=document.createElement('div');bar.className='show-bar'+(es(s)?' es':'');
      bar.style.cssText=`left:${sx}px;top:${y}px;width:${w}px;height:${h}px;background:${bc(s)};color:${btc(s)}`;
      if(w>=24)bar.textContent=s.name;bar.title=s.name+' ('+fd(s.start)+'~'+fd(s.end)+')';
      bar.addEventListener('click',()=>openModal(s));gr.appendChild(bar);
    });
    gbody.appendChild(gr);
  });
}

function renderList(){
  const reg=document.getElementById('rl').value,st=document.getElementById('sl').value;
  const vw=document.getElementById('vl').value,sort=document.getElementById('ol').value;
  const q=document.getElementById('ql').value.trim().toLowerCase();
  let fl=SHOWS.filter(s=>{
    if(reg&&s.region!==reg)return false;if(st&&gst(s)!==st)return false;
    if(vw==='viewed'&&!iv(s))return false;if(vw==='unviewed'&&iv(s))return false;
    if(q&&!(s.name+s.facility+s.hall).toLowerCase().includes(q))return false;return true;
  });
  const so={ongoing:0,upcoming:1,ended:2};
  fl.sort((a,b)=>{switch(sort){case'status':{const d=so[gst(a)]-so[gst(b)];return d?d:a.name<b.name?-1:1;}case'name':return a.name<b.name?-1:1;case'dur-asc':return dur(a)-dur(b);case'dur-desc':return dur(b)-dur(a);default:return 0;}});
  const tb=document.getElementById('ltbody');tb.innerHTML='';
  document.getElementById('lempty').classList.toggle('show',fl.length===0);
  if(curTab==='list')cbadge.textContent=fl.length+'개 공연';
  fl.forEach(s=>{
    const status=gst(s),soon=es(s),viewed=iv(s),recs=gsr(s),rcnt=recs.length,d=dur(s),dl2=dl(s);
    const tr=document.createElement('tr');tr.className='list-row';
    tr.innerHTML=`<td><div class="vcell"><button class="vbtn${viewed?' on':''}">${viewed?'★':'☆'}</button>${rcnt>0?`<span class="rpill">${rcnt}</span>`:''}</div></td>
      <td><div class="cell-name"><div class="ndot" style="background:${bc(s)}"></div><span class="ntext">${s.name}</span>${soon?`<span class="ebadge">D-${dl2}</span>`:''}</div></td>
      <td><span class="sbadge ${status}">${SL[status]}</span></td>
      <td class="col-venue">${vd(s.facility,s.hall)}</td>
      <td style="font-size:12px;color:var(--text2)">${s.region||'-'}</td>
      <td><div class="col-dates">${fd(s.start)} ~ ${fd(s.end)}</div><div class="col-dur">${d}일</div></td>`;
    tr.querySelector('.vbtn').addEventListener('click',e=>{e.stopPropagation();tv(s);renderList();});
    tr.addEventListener('click',e=>{if(e.target.closest('.vbtn'))return;openModal(s);});
    tb.appendChild(tr);
  });
}

function renderRecord(){
  const q=document.getElementById('qr').value.trim().toLowerCase();
  const allR=gr();
  const tbody=document.getElementById('rec-tbody');tbody.innerHTML='';
  const empty=document.getElementById('rempty');
  let keys=Object.keys(allR).filter(k=>allR[k]&&allR[k].length>0);
  if(q)keys=keys.filter(k=>{const s=SM[k];return s&&s.name.toLowerCase().includes(q);});
  empty.classList.toggle('show',keys.length===0);
  if(curTab==='record')cbadge.textContent=keys.length+'개 공연 기록';
  keys.sort((a,b)=>{const ae=allR[a],be=allR[b];const ad=ae.map(e=>e.date).sort().pop()||'',bd=be.map(e=>e.date).sort().pop()||'';return bd<ad?-1:bd>ad?1:0;});
  keys.forEach(k=>{
    const s=SM[k];if(!s)return;
    const entries=(allR[k]||[]).sort((a,b)=>b.date.localeCompare(a.date));
    const pe=entries.filter(e=>e.photo);
    // Main row
    const tr=document.createElement('tr');tr.className='rec-row';
    // 공연명
    const tdName=document.createElement('td');
    tdName.innerHTML=`<div class="cell-name"><div class="rdot" style="background:${bc(s)}"></div><span class="ntext">${s.name}</span></div>`;
    tr.appendChild(tdName);
    // 상태
    const tdSt=document.createElement('td');
    tdSt.innerHTML=`<span class="sbadge ${gst(s)}">${SL[gst(s)]}</span>`;tr.appendChild(tdSt);
    // 극장
    const tdVn=document.createElement('td');tdVn.className='col-venue';tdVn.textContent=vd(s.facility,s.hall);tr.appendChild(tdVn);
    // 관람
    const tdCnt=document.createElement('td');
    tdCnt.innerHTML=`<span class="rcnt">${entries.length}회</span>${pe.length>0?` <span style="font-size:10px;color:var(--text2)">📷${pe.length}</span>`:''}`;tr.appendChild(tdCnt);
    // 사진 증빙 날짜 chips
    const tdDates=document.createElement('td');
    if(pe.length>0){
      const wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-wrap:wrap;gap:4px;';
      pe.forEach(e=>{const chip=document.createElement('span');chip.className='dchip';chip.textContent='📷 '+fds(e.date);chip.addEventListener('click',ev=>{ev.stopPropagation();showPhoto(e.photo.dataUrl);});wrap.appendChild(chip);});
      tdDates.appendChild(wrap);
    }
    tr.appendChild(tdDates);
    // 액션
    const tdAct=document.createElement('td');
    const addBtn=document.createElement('button');addBtn.className='radd';addBtn.textContent='+ 추가';
    addBtn.addEventListener('click',e=>{e.stopPropagation();openAR(s);});
    const expBtn=document.createElement('button');expBtn.className='rexp';expBtn.textContent='▼';expBtn.style.marginLeft='4px';
    tdAct.appendChild(addBtn);tdAct.appendChild(expBtn);tr.appendChild(tdAct);
    tbody.appendChild(tr);
    // Detail row
    const detailTr=document.createElement('tr');detailTr.className='rec-detail-row';
    const detailTd=document.createElement('td');detailTd.className='rec-detail-td';detailTd.colSpan=6;
    const inner=document.createElement('div');inner.className='rec-entries-inner';
    entries.forEach(e=>{
      const row=document.createElement('div');row.className='rentry';
      row.innerHTML=`<span class="edate">${fd(e.date)}${e.photo?' 📷':''}</span>`;
      if(e.photo){const pb=document.createElement('button');pb.className='ephoto';pb.title='사진 보기';pb.textContent='🖼';pb.addEventListener('click',()=>showPhoto(e.photo.dataUrl));row.appendChild(pb);}
      const db=document.createElement('button');db.className='edel';db.title='삭제';db.textContent='✕';
      db.addEventListener('click',()=>{if(!confirm('이 관람 기록을 삭제하시겠습니까?'))return;delRec(s,e.id);renderRecord();if(ov.classList.contains('open')&&curShow&&sk(curShow)===sk(s))updModal(s);});
      row.appendChild(db);inner.appendChild(row);
    });
    detailTd.appendChild(inner);detailTr.appendChild(detailTd);tbody.appendChild(detailTr);
    expBtn.addEventListener('click',e=>{e.stopPropagation();const op=detailTr.classList.toggle('open');expBtn.textContent=op?'▲':'▼';});
    tr.addEventListener('click',e=>{if(e.target.closest('.radd,.rexp,.dchip'))return;openModal(s);});
  });
}

// Modal
function openModal(s){
  curShow=s;
  document.getElementById('mcolor').style.background=sc(s.name);
  document.getElementById('mtitle').textContent=s.name;
  document.getElementById('mst').innerHTML=`<span class="sbadge ${gst(s)}">${SL[gst(s)]}</span>`;
  document.getElementById('mvn').textContent=vd(s.facility,s.hall);
  document.getElementById('mrg').textContent=s.region||'-';
  document.getElementById('mdt').textContent=fd(s.start)+' ~ '+fd(s.end);
  document.getElementById('mdur').textContent=dur(s)+'일';
  updModal(s);ov.classList.add('open');
}
function updModal(s){
  const viewed=iv(s);const star=document.getElementById('mstar');
  star.className=viewed?'on':'';star.textContent=viewed?'★ 관람':'☆ 미관람';
  const recs=gsr(s),wrap=document.getElementById('mrecdates');wrap.innerHTML='';
  recs.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    const p=document.createElement('span');p.className='mdrec'+(e.photo?' hp':'');
    p.textContent=(e.photo?'📷 ':'')+fd(e.date);
    if(e.photo)p.addEventListener('click',()=>showPhoto(e.photo.dataUrl));
    wrap.appendChild(p);
  });
}
document.getElementById('mstar').addEventListener('click',()=>{if(!curShow)return;tv(curShow);updModal(curShow);if(curTab==='list')renderList();});
document.getElementById('madd').addEventListener('click',()=>{if(!curShow)return;openAR(curShow);});
document.getElementById('mcls').addEventListener('click',()=>ov.classList.remove('open'));
ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});

// Add record
function openAR(s){
  arTarget=s;pendPhoto=null;
  document.getElementById('armshow').textContent=s.name+' · '+vd(s.facility,s.hall);
  document.getElementById('ardate').value=TI;
  document.getElementById('arpreview').style.display='none';
  document.getElementById('arfile').value='';
  document.getElementById('pzone').textContent='📷 사진 선택 또는 촬영';
  document.getElementById('pzone').classList.remove('filled');
  document.getElementById('aro').classList.add('open');
}
document.getElementById('pzone').addEventListener('click',()=>document.getElementById('arfile').click());
document.getElementById('arfile').addEventListener('change',async function(){
  const f=this.files[0];if(!f)return;
  const du=await compImg(f);pendPhoto={dataUrl:du,type:'image/jpeg',name:f.name,ext:'jpg'};
  const prev=document.getElementById('arpreview');prev.src=du;prev.style.display='block';
  document.getElementById('pzone').textContent='📷 '+f.name;document.getElementById('pzone').classList.add('filled');
});
document.getElementById('arcancel').addEventListener('click',()=>document.getElementById('aro').classList.remove('open'));
document.getElementById('arsave').addEventListener('click',()=>{

async function compImg(file){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1400;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',.78));
    };img.src=url;
  });
}

// Ending modal
document.getElementById('ending-btn').addEventListener('click',openEnding);
function openEnding(){
  const shows=SHOWS.filter(s=>gst(s)==='ongoing').map(s=>({...s,dlo:dl(s)})).sort((a,b)=>a.dlo-b.dlo);
  document.getElementById('esub').textContent=`공연중 ${shows.length}개 (종료 임박순)`;
  const list=document.getElementById('elist');list.innerHTML='';
  shows.forEach(s=>{
    const item=document.createElement('div');item.className='eitem';
    const cls=s.dlo<=7?'dr':s.dlo<=14?'do':'dg';
    item.innerHTML=`<span class="edays ${cls}">D-${s.dlo}</span><div style="flex:1;overflow:hidden"><div class="ename">${s.name}</div><div class="evenue">${vd(s.facility,s.hall)} · ${s.region}</div></div><div class="edate2">${fd(s.end)}</div>`;
    item.addEventListener('click',()=>{document.getElementById('eo').classList.remove('open');openModal(s);});
    list.appendChild(item);
  });
  document.getElementById('eo').classList.add('open');
}

// CSV / ZIP
document.getElementById('csv-btn').addEventListener('click',()=>{
  const recs=gr(),pm={};let pn=1;
  const all=[];Object.entries(recs).forEach(([k,entries])=>{const s=SM[k];if(!s)return;entries.forEach(e=>all.push({s,e}));});
  all.sort((a,b)=>a.e.date.localeCompare(b.e.date));all.forEach(({e})=>{if(e.photo)pm[e.id]=pn++;});
  const rows=[['번호','공연명','관람일','극장','지역','사진파일명']];let n=1;
  all.forEach(({s,e})=>{const ext=e.photo?.ext||'jpg';const fn=e.photo?`이예랑_${String(pm[e.id]).padStart(2,'0')}_${s.name.replace(/[\/\\:*?"<>|]/g,'')}.${ext}`:'';rows.push([n++,s.name,e.date,vd(s.facility,s.hall),s.region,fn]);});
  if(rows.length===1){alert('저장된 관람 기록이 없습니다.');return;}
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='이예랑_관람기록.csv';a.click();
});
document.getElementById('zip-btn').addEventListener('click',async()=>{
  if(typeof JSZip==='undefined'){alert('ZIP 라이브러리를 불러오지 못했습니다. 온라인 상태에서 다시 시도해주세요.');return;}
  const recs=gr();const pe=[];
  Object.entries(recs).forEach(([k,entries])=>{const s=SM[k];if(!s)return;entries.forEach(e=>{if(e.photo)pe.push({s,e});});});
  pe.sort((a,b)=>a.e.date.localeCompare(b.e.date));
  if(!pe.length){alert('저장된 사진이 없습니다.');return;}
  const zip=new JSZip();
  pe.forEach(({s,e},i)=>{const ext=e.photo.ext||'jpg';const nm=`이예랑_${String(i+1).padStart(2,'0')}_${s.name.replace(/[\/\\:*?"<>|]/g,'')}.${ext}`;zip.file(nm,e.photo.dataUrl.split(',')[1],{base64:true});});
  const blob=await zip.generateAsync({type:'blob'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='이예랑_티켓사진.zip';a.click();URL.revokeObjectURL(url);
});

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{

    const tab=btn.dataset.tab;if(tab===curTab)return;curTab=tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
    document.getElementById('tab-gantt').classList.toggle('hidden',tab!=='gantt');
    document.getElementById('tab-list').classList.toggle('hidden',tab!=='list');
    document.getElementById('tab-record').classList.toggle('hidden',tab!=='record');
    document.getElementById('gc').classList.toggle('hidden',tab!=='gantt');
    document.getElementById('lc').classList.toggle('hidden',tab!=='list');
    document.getElementById('rc').classList.toggle('hidden',tab!=='record');
    if(tab==='gantt')render();if(tab==='list')renderList();if(tab==='record')renderRecord();
  });
});
