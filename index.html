<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>2026 뮤지컬 공연 라인업</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0d0d1a;
  --bg2: #13132a;
  --bg3: #1a1a35;
  --border: #252548;
  --text1: #e8e8f2;
  --text2: #7878a8;
  --text3: #5050a8;
  --accent: #8b7cf8;
  --today: #ff5f5f;
  --header-h: 52px;
  --month-h: 36px;
  --venue-w: 210px;
  --lane-h: 28px;
  --row-pad: 5px;
  --day-px: 3.2px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text1);
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ── Header ── */
#header {
  height: var(--header-h);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
  flex-shrink: 0;
  z-index: 20;
}
#header h1 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex: 1;
  white-space: nowrap;
}
#header select, #header input {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text1);
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
}
#region-filter { width: 90px; }
#search { width: 170px; }
#count-badge {
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
  min-width: 100px;
  text-align: right;
}

/* ── Chart Layout ── */
#chart-outer {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Venue Sidebar ── */
#venue-col {
  width: var(--venue-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg2);
  border-right: 2px solid var(--border);
  z-index: 10;
}
#venue-col-header {
  height: var(--month-h);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
#venue-list {
  flex: 1;
  overflow-y: hidden;
  overflow-x: hidden;
}
.venue-row {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 3px 12px;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  gap: 1px;
}
.venue-fac {
  font-size: 10px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
.venue-hall {
  font-size: 12px;
  font-weight: 600;
  color: var(--text1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}

/* ── Timeline Area ── */
#timeline-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}
#month-header-wrap {
  height: var(--month-h);
  overflow-x: hidden;
  flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
#month-header {
  height: var(--month-h);
  position: relative;
}
.month-cell {
  position: absolute;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  padding-left: 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text2);
  border-left: 1px solid var(--border);
  letter-spacing: -0.2px;
}
.week-tick {
  position: absolute;
  top: 50%;
  width: 1px;
  height: 8px;
  background: var(--border);
}
#gantt-scroll {
  flex: 1;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
#gantt-body {
  position: relative;
  min-height: 100%;
}

/* Gantt rows */
.gantt-row {
  position: relative;
  border-bottom: 1px solid var(--border);
}
.gantt-row:nth-child(odd) { background: rgba(255,255,255,0.012); }
.month-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
  opacity: 0.6;
  pointer-events: none;
}

/* Show bars */
.show-bar {
  position: absolute;
  border-radius: 4px;
  display: flex;
  align-items: center;
  padding: 0 6px;
  cursor: pointer;
  overflow: hidden;
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,0.92);
  white-space: nowrap;
  user-select: none;
  transition: filter 0.12s, transform 0.12s;
  letter-spacing: -0.2px;
}
.show-bar:hover {
  filter: brightness(1.2);
  transform: scaleY(1.08);
  z-index: 5;
}

/* Today line */
#today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--today);
  z-index: 6;
  pointer-events: none;
  box-shadow: 0 0 6px rgba(255,95,95,0.5);
}
#today-pill {
  position: absolute;
  top: 4px;
  background: var(--today);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 10px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 7;
  transform: translateX(-50%);
}

/* ── Modal ── */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#overlay.open { display: flex; }
#modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  width: min(480px, 92vw);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal-color-bar {
  height: 4px;
  border-radius: 2px;
  margin-bottom: 16px;
}
#modal h2 {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 14px;
}
.modal-info { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.modal-row { display: flex; gap: 10px; align-items: baseline; }
.modal-lbl { font-size: 11px; color: var(--text2); min-width: 56px; text-transform: uppercase; letter-spacing: 0.3px; }
.modal-val { font-size: 14px; color: var(--text1); flex: 1; line-height: 1.4; }
#modal-close {
  width: 100%;
  padding: 11px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.2px;
}
#modal-close:active { opacity: 0.8; }

/* ── Empty state ── */
#empty-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text2);
  gap: 10px;
  font-size: 15px;
}
#empty-state.show { display: flex; }
#empty-state span:first-child { font-size: 40px; }

/* ── Scrollbar ── */
#gantt-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
#gantt-scroll::-webkit-scrollbar-track { background: var(--bg); }
#gantt-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <h1>🎭 2026 뮤지컬 공연 라인업</h1>
  <select id="region-filter">
    <option value="">전체</option>
  </select>
  <input type="text" id="search" placeholder="공연명 · 극장 검색" autocomplete="off" spellcheck="false">
  <span id="count-badge"></span>
</div>

<div id="chart-outer">
  <div id="venue-col">
    <div id="venue-col-header">공연장</div>
    <div id="venue-list"></div>
  </div>
  <div id="timeline-area">
    <div id="month-header-wrap">
      <div id="month-header"></div>
    </div>
    <div id="gantt-scroll">
      <div id="gantt-body">
        <div id="today-line"></div>
        <div id="today-pill">오늘</div>
        <div id="empty-state">
          <span>🔍</span>
          <span>해당하는 공연이 없습니다</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="modal">
    <div class="modal-color-bar" id="modal-color"></div>
    <h2 id="modal-title"></h2>
    <div class="modal-info">
      <div class="modal-row"><span class="modal-lbl">극장</span><span class="modal-val" id="modal-venue"></span></div>
      <div class="modal-row"><span class="modal-lbl">지역</span><span class="modal-val" id="modal-region"></span></div>
      <div class="modal-row"><span class="modal-lbl">기간</span><span class="modal-val" id="modal-dates"></span></div>
      <div class="modal-row"><span class="modal-lbl">공연일수</span><span class="modal-val" id="modal-dur"></span></div>
    </div>
    <button id="modal-close">닫기</button>
  </div>
</div>

<script src="data/shows.js"></script>
<script>
// 데이터는 data/shows.js 에서 로드됨

// ===== CONSTANTS =====
const YEAR = 2026;
const YEAR_START = new Date(2026, 0, 1);
const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const TOTAL_DAYS = MONTH_DAYS.reduce((a,b)=>a+b,0); // 365

const DAY_PX = 3.2;
const LANE_H = 26;
const ROW_PAD = 5;

const PALETTE = [
  '#7c6cf4','#f4706c','#4cba80','#f4c83c','#4caaf4',
  '#f46cd4','#78e070','#f49a60','#4cb0f4','#d468f4',
  '#f0e060','#50d4c0','#f46890','#90d450','#6888f4',
  '#f4b060','#50d490','#e060f4','#c8f460','#60ccf4'
];

function strHash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return h;
}
const colorCache = {};
function showColor(name) {
  if (!colorCache[name]) colorCache[name] = PALETTE[strHash(name) % PALETTE.length];
  return colorCache[name];
}

function parseISO(s) {
  if (!s || s.length < 10) return null;
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function dayOf(date) {
  let days = 0;
  for (let m = 0; m < date.getMonth(); m++) days += MONTH_DAYS[m];
  return days + date.getDate() - 1;
}

function fmtDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return y + '.' + m + '.' + d;
}

// ===== PROCESS DATA =====
const SHOWS = SHOWS_RAW.map(r => ({
  name: r[0], start: r[1], end: r[2],
  facility: r[3], hall: r[4], region: r[5]
}));

// ===== DOM REFS =====
const regionSel = document.getElementById('region-filter');
const searchEl = document.getElementById('search');
const venueList = document.getElementById('venue-list');
const ganttBody = document.getElementById('gantt-body');
const monthHeader = document.getElementById('month-header');
const mhWrap = document.getElementById('month-header-wrap');
const ganttScroll = document.getElementById('gantt-scroll');
const countBadge = document.getElementById('count-badge');
const overlay = document.getElementById('overlay');
const emptyState = document.getElementById('empty-state');

// ===== POPULATE FILTERS =====
const allRegions = [...new Set(SHOWS.map(s=>s.region).filter(Boolean))].sort();
allRegions.forEach(r => {
  const o = document.createElement('option');
  o.value = r; o.textContent = r;
  regionSel.appendChild(o);
});
regionSel.value = '서울';

// ===== BUILD MONTH HEADER =====
const totalPx = TOTAL_DAYS * DAY_PX;
monthHeader.style.width = totalPx + 'px';
let mOff = 0;
MONTH_NAMES.forEach((name, i) => {
  const days = MONTH_DAYS[i];
  const cell = document.createElement('div');
  cell.className = 'month-cell';
  cell.textContent = name;
  cell.style.left = (mOff * DAY_PX) + 'px';
  cell.style.width = (days * DAY_PX) + 'px';
  monthHeader.appendChild(cell);
  // Week ticks
  for (let w = 7; w < days; w += 7) {
    const tick = document.createElement('div');
    tick.className = 'week-tick';
    tick.style.left = ((mOff + w) * DAY_PX) + 'px';
    monthHeader.appendChild(tick);
  }
  mOff += days;
});

// ===== TODAY LINE =====
const today = new Date();
const todayLine = document.getElementById('today-line');
const todayPill = document.getElementById('today-pill');
if (today.getFullYear() === 2026) {
  const tx = dayOf(today) * DAY_PX;
  todayLine.style.left = tx + 'px';
  todayPill.style.left = tx + 'px';
} else {
  todayLine.style.display = 'none';
  todayPill.style.display = 'none';
}

// ===== LANE ASSIGNMENT =====
function assignLanes(shows) {
  const sorted = [...shows].sort((a,b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0);
  const laneEnds = [];
  sorted.forEach(s => {
    let placed = false;
    for (let i = 0; i < laneEnds.length; i++) {
      if (laneEnds[i] < s.start) {
        s._lane = i; laneEnds[i] = s.end; placed = true; break;
      }
    }
    if (!placed) { s._lane = laneEnds.length; laneEnds.push(s.end); }
  });
  return laneEnds.length;
}

// ===== SCROLL SYNC =====
let syncLock = false;
ganttScroll.addEventListener('scroll', () => {
  if (syncLock) return;
  syncLock = true;
  mhWrap.scrollLeft = ganttScroll.scrollLeft;
  venueList.scrollTop = ganttScroll.scrollTop;
  syncLock = false;
});
venueList.addEventListener('scroll', () => {
  if (syncLock) return;
  syncLock = true;
  ganttScroll.scrollTop = venueList.scrollTop;
  syncLock = false;
});

// ===== RENDER =====
function render() {
  const reg = regionSel.value;
  const q = searchEl.value.trim().toLowerCase();

  const filtered = SHOWS.filter(s => {
    if (reg && s.region !== reg) return false;
    if (q) {
      const hay = (s.name + s.facility + s.hall).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  // Group by venue
  const venueMap = new Map();
  filtered.forEach(s => {
    const key = s.facility + '\x00' + s.hall;
    if (!venueMap.has(key)) venueMap.set(key, { facility: s.facility, hall: s.hall, region: s.region, shows: [] });
    venueMap.get(key).shows.push(s);
  });

  const venues = [...venueMap.values()].sort((a,b) => {
    if (a.facility < b.facility) return -1;
    if (a.facility > b.facility) return 1;
    return a.hall < b.hall ? -1 : 1;
  });

  // Clear old content
  venueList.innerHTML = '';
  ganttBody.querySelectorAll('.gantt-row, .month-line').forEach(el => el.remove());

  emptyState.classList.toggle('show', venues.length === 0);
  countBadge.textContent = filtered.length + '개 공연 / ' + venues.length + '개 극장';

  ganttBody.style.width = totalPx + 'px';

  // Month separator lines in gantt body
  let lineOff = 0;
  MONTH_DAYS.forEach(d => {
    const line = document.createElement('div');
    line.className = 'month-line';
    line.style.left = (lineOff * DAY_PX) + 'px';
    ganttBody.insertBefore(line, todayLine);
    lineOff += d;
  });

  venues.forEach(({ facility, hall, shows }) => {
    const laneCount = assignLanes(shows);
    const rowH = laneCount * LANE_H + ROW_PAD * 2;

    // Sidebar row
    const vRow = document.createElement('div');
    vRow.className = 'venue-row';
    vRow.style.height = rowH + 'px';
    if (facility !== hall) {
      const fd = document.createElement('div');
      fd.className = 'venue-fac';
      fd.textContent = facility;
      vRow.appendChild(fd);
    }
    const hd = document.createElement('div');
    hd.className = 'venue-hall';
    hd.textContent = hall;
    vRow.appendChild(hd);
    venueList.appendChild(vRow);

    // Gantt row
    const gRow = document.createElement('div');
    gRow.className = 'gantt-row';
    gRow.style.height = rowH + 'px';
    gRow.style.width = totalPx + 'px';

    shows.forEach(show => {
      const sd = parseISO(show.start), ed = parseISO(show.end);
      if (!sd || !ed) return;
      const sx = dayOf(sd) * DAY_PX;
      const ex = (dayOf(ed) + 1) * DAY_PX;
      const w = Math.max(4, ex - sx);
      const y = ROW_PAD + show._lane * LANE_H;
      const h = LANE_H - 3;

      const bar = document.createElement('div');
      bar.className = 'show-bar';
      bar.style.left = sx + 'px';
      bar.style.top = y + 'px';
      bar.style.width = w + 'px';
      bar.style.height = h + 'px';
      bar.style.background = showColor(show.name);
      if (w >= 24) bar.textContent = show.name;
      bar.title = show.name + ' (' + fmtDate(show.start) + '~' + fmtDate(show.end) + ')';
      bar.addEventListener('click', () => openModal(show));
      gRow.appendChild(bar);
    });

    ganttBody.appendChild(gRow);
  });
}

// ===== MODAL =====
function openModal(show) {
  document.getElementById('modal-color').style.background = showColor(show.name);
  document.getElementById('modal-title').textContent = show.name;
  const venue = show.facility === show.hall ? show.hall : show.facility + ' ' + show.hall;
  document.getElementById('modal-venue').textContent = venue;
  document.getElementById('modal-region').textContent = show.region || '-';
  document.getElementById('modal-dates').textContent = fmtDate(show.start) + ' ~ ' + fmtDate(show.end);
  const sd = parseISO(show.start), ed = parseISO(show.end);
  const dur = sd && ed ? Math.round((ed - sd) / 86400000) + 1 : '-';
  document.getElementById('modal-dur').textContent = dur + '일';
  overlay.classList.add('open');
}
document.getElementById('modal-close').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

// ===== EVENTS =====
regionSel.addEventListener('change', render);
searchEl.addEventListener('input', render);

render();

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
